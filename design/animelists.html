<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Lists - Mitteiru</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }

        /* Animaciones para Dropdowns y Modales */
        .dropdown-enter {
            opacity: 0;
            transform: scale(0.95) translateY(-10px);
            visibility: hidden;
        }

        .dropdown-enter-active {
            opacity: 1;
            transform: scale(1) translateY(0);
            visibility: visible;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-enter {
            opacity: 0;
            pointer-events: none;
        }

        .modal-enter-active {
            opacity: 1;
            pointer-events: auto;
            transition: opacity 0.3s ease;
        }

        .modal-content-enter {
            transform: scale(0.95) translateY(20px);
        }

        .modal-content-enter-active {
            transform: scale(1) translateY(0);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
    </style>
</head>

<body class="bg-gray-950 text-white min-h-screen selection:bg-indigo-500 selection:text-white pb-20">

    <!-- Navbar Sticky -->
    <nav class="fixed w-full z-50 top-0 backdrop-blur-md bg-gray-950/80 border-b border-white/10">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-8">
                <a href="#" class="text-2xl font-bold tracking-tighter text-white">Mitteiru</a>
                <div class="hidden md:flex gap-6 text-sm font-medium text-gray-300">
                    <a href="#" class="hover:text-white transition-colors">Home</a>
                    <a href="#" class="hover:text-white transition-colors">Directory</a>
                </div>
            </div>

            <div class="flex items-center gap-6">
                <!-- Buscador -->
                <div class="relative hidden sm:block">
                    <input type="text" placeholder="Search an anime..."
                        class="bg-white/5 border border-white/10 rounded-full py-2 pl-10 pr-4 text-sm w-64 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all placeholder-gray-500 text-white">
                    <svg class="w-4 h-4 absolute left-4 top-2.5 text-gray-500" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>

                <!-- Menú de Avatar Interactivo -->
                <div class="relative">
                    <img id="avatar-btn" src="https://i.pravatar.cc/150?img=32" alt="User"
                        class="w-10 h-10 rounded-full border-2 border-indigo-500 object-cover cursor-pointer hover:scale-105 transition-transform">

                    <!-- Dropdown del Avatar (Glassmorphism) -->
                    <div id="avatar-dropdown"
                        class="absolute right-0 mt-3 w-56 bg-gray-900/90 backdrop-blur-xl border border-white/10 rounded-2xl shadow-[0_10px_40px_rgba(0,0,0,0.5)] py-2 dropdown-enter z-50 origin-top-right">
                        <!-- Info de Usuario -->
                        <div class="px-4 py-3 border-b border-white/10 mb-2">
                            <p class="text-sm font-bold text-white truncate">Gonzalo</p>
                            <p class="text-xs text-gray-400 truncate">Premium Member</p>
                        </div>

                        <!-- Opciones -->
                        <a href="#"
                            class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-300 hover:bg-white/10 hover:text-white transition-colors">
                            <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4 6h16M4 10h16M4 14h16M4 18h16"></path>
                            </svg>
                            My list
                        </a>
                        <a href="#"
                            class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-300 hover:bg-white/10 hover:text-white transition-colors">
                            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            History
                        </a>
                        <a href="#"
                            class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-300 hover:bg-white/10 hover:text-white transition-colors">
                            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z">
                                </path>
                            </svg>
                            Change Profile
                        </a>
                        <div class="h-px bg-white/10 my-2"></div>
                        <a href="#"
                            class="flex items-center gap-3 px-4 py-2.5 text-sm text-red-400 hover:bg-red-500/10 transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                                </path>
                            </svg>
                            Logout
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="max-w-7xl mx-auto px-6 pt-32">

        <!-- Cabecera de Listas -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-12">

            <!-- Selector de Lista -->
            <div class="relative z-40">
                <button id="list-selector-btn"
                    class="text-4xl md:text-5xl font-extrabold text-white flex items-center gap-3 hover:text-indigo-400 transition-colors tracking-tight">
                    Watching
                    <svg class="w-8 h-8 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 9l-7 7-7-7"></path>
                    </svg>
                </button>

                <!-- Dropdown de Listas -->
                <div id="list-dropdown"
                    class="absolute left-0 mt-4 w-64 bg-gray-900/90 backdrop-blur-xl border border-white/10 rounded-2xl shadow-[0_10px_40px_rgba(0,0,0,0.5)] py-2 dropdown-enter origin-top-left">
                    <a href="#"
                        class="flex items-center justify-between px-5 py-3 text-white bg-white/10 border-l-2 border-indigo-500 font-semibold">
                        Watching
                        <span class="text-xs bg-indigo-500 text-white px-2 py-0.5 rounded-full">12</span>
                    </a>
                    <a href="#"
                        class="flex items-center justify-between px-5 py-3 text-gray-400 hover:text-white hover:bg-white/5 transition-colors">
                        Completed
                        <span class="text-xs bg-white/10 px-2 py-0.5 rounded-full">84</span>
                    </a>
                    <a href="#"
                        class="flex items-center justify-between px-5 py-3 text-gray-400 hover:text-white hover:bg-white/5 transition-colors">
                        Planning
                        <span class="text-xs bg-white/10 px-2 py-0.5 rounded-full">3</span>
                    </a>
                </div>
            </div>

            <!-- Botón Crear Lista -->
            <button id="btn-open-modal"
                class="bg-white/10 hover:bg-white/20 text-white backdrop-blur-md border border-white/10 px-6 py-3 rounded-full font-bold transition-all shadow-lg flex items-center justify-center gap-2 hover:scale-105 active:scale-95 shrink-0">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                New List
            </button>
        </div>

        <!-- Grid de Animes en la lista -->
        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-6">

            <!-- Tarjeta 1 con Progreso -->
            <div
                class="group relative rounded-xl overflow-hidden aspect-[2/3] cursor-pointer shadow-lg bg-gray-900 border border-white/10">
                <img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?q=80&w=600&auto=format&fit=crop"
                    alt="Anime Poster"
                    class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">

                <!-- Overlay de acciones -->
                <div
                    class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center gap-3 backdrop-blur-[2px]">
                    <button
                        class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center hover:bg-indigo-500 transition-colors shadow-lg shadow-indigo-500/50">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                        </svg>
                    </button>
                    <button
                        class="w-10 h-10 rounded-full bg-white/20 border border-white/30 flex items-center justify-center hover:bg-red-500/80 hover:border-red-500 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
                            </path>
                        </svg>
                    </button>
                </div>

                <!-- Info y Barra de progreso persistente en la lista -->
                <div
                    class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-gray-950 via-gray-950/80 to-transparent pt-10 pb-3 px-3">
                    <h3 class="text-white font-bold text-sm line-clamp-1">Bocchi the Rock!</h3>
                    <div class="flex items-center justify-between text-[10px] text-gray-400 mt-1 mb-2 font-medium">
                        <span>Ep 8 / 12</span>
                        <span>66%</span>
                    </div>
                    <div class="w-full bg-gray-800 rounded-full h-1.5 overflow-hidden">
                        <div class="bg-indigo-500 h-1.5 rounded-full" style="width: 66%"></div>
                    </div>
                </div>
            </div>

            <!-- Tarjeta 2 -->
            <div
                class="group relative rounded-xl overflow-hidden aspect-[2/3] cursor-pointer shadow-lg bg-gray-900 border border-white/10">
                <img src="https://images.unsplash.com/photo-1541562232579-512a21360020?q=80&w=600&auto=format&fit=crop"
                    alt="Anime Poster"
                    class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
                <div
                    class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center gap-3 backdrop-blur-[2px]">
                    <button
                        class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center hover:bg-indigo-500 transition-colors shadow-lg shadow-indigo-500/50">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                        </svg>
                    </button>
                    <button
                        class="w-10 h-10 rounded-full bg-white/20 border border-white/30 flex items-center justify-center hover:bg-red-500/80 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
                            </path>
                        </svg>
                    </button>
                </div>
                <div
                    class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-gray-950 via-gray-950/80 to-transparent pt-10 pb-3 px-3">
                    <h3 class="text-white font-bold text-sm line-clamp-1">Akira (Re-watch)</h3>
                    <div class="flex items-center justify-between text-[10px] text-gray-400 mt-1 mb-2 font-medium">
                        <span>Movie</span>
                        <span>0%</span>
                    </div>
                    <div class="w-full bg-gray-800 rounded-full h-1.5 overflow-hidden">
                        <div class="bg-indigo-500 h-1.5 rounded-full" style="width: 5%"></div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Modal: Crear Nueva Lista -->
    <div id="modal-overlay"
        class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] modal-enter flex items-center justify-center p-4">

        <div id="modal-content"
            class="bg-gray-900 border border-white/10 rounded-3xl p-8 max-w-md w-full shadow-[0_20px_60px_rgba(0,0,0,0.8)] modal-content-enter relative">
            <!-- Botón Cerrar -->
            <button id="btn-close-modal"
                class="absolute top-6 right-6 text-gray-500 hover:text-white transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                    </path>
                </svg>
            </button>

            <h3 class="text-2xl font-bold text-white mb-2">Create new list</h3>
            <p class="text-sm text-gray-400 mb-8">Organize your anime exactly how you want.</p>

            <div class="mb-6">
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-widest mb-2">List
                    Name</label>
                <input type="text" placeholder="e.g. Masterpieces, Weekend binge..."
                    class="w-full bg-black/30 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
            </div>

            <div class="mb-8">
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-widest mb-3">Privacy</label>
                <div class="flex gap-4">
                    <label class="flex-1 cursor-pointer group">
                        <input type="radio" name="privacy" class="peer sr-only" checked>
                        <div
                            class="bg-black/30 border border-indigo-500 text-indigo-400 rounded-xl p-3 text-center text-sm font-semibold peer-checked:bg-indigo-600/20 peer-checked:text-indigo-300 transition-all">
                            Public</div>
                    </label>
                    <label class="flex-1 cursor-pointer group">
                        <input type="radio" name="privacy" class="peer sr-only">
                        <div
                            class="bg-black/30 border border-white/10 text-gray-400 rounded-xl p-3 text-center text-sm font-semibold peer-checked:border-indigo-500 peer-checked:bg-indigo-600/20 peer-checked:text-indigo-300 transition-all">
                            Private</div>
                    </label>
                </div>
            </div>

            <button
                class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded-xl font-bold transition-all shadow-lg shadow-indigo-600/30 active:scale-95">
                Create List
            </button>
        </div>
    </div>

    <script>
        // Utilidad para manejar Dropdowns
        function setupDropdown(btnId, dropdownId) {
            const btn = document.getElementById(btnId);
            const dropdown = document.getElementById(dropdownId);

            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                dropdown.classList.toggle('dropdown-enter-active');
            });

            // Cerrar al hacer click afuera
            document.addEventListener('click', (e) => {
                if (!btn.contains(e.target) && !dropdown.contains(e.target)) {
                    dropdown.classList.remove('dropdown-enter-active');
                }
            });
        }

        // Inicializar Dropdowns
        setupDropdown('avatar-btn', 'avatar-dropdown');
        setupDropdown('list-selector-btn', 'list-dropdown');

        // Lógica del Modal de Crear Lista
        const modalOverlay = document.getElementById('modal-overlay');
        const modalContent = document.getElementById('modal-content');
        const btnOpenModal = document.getElementById('btn-open-modal');
        const btnCloseModal = document.getElementById('btn-close-modal');

        function openModal() {
            modalOverlay.classList.add('modal-enter-active');
            modalContent.classList.add('modal-content-enter-active');
        }

        function closeModal() {
            modalContent.classList.remove('modal-content-enter-active');
            modalOverlay.classList.remove('modal-enter-active');
        }

        btnOpenModal.addEventListener('click', openModal);
        btnCloseModal.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });
    </script>
</body>

</html>
