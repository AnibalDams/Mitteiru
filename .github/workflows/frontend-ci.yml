name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mitteiru-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mitteiru-frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck / Svelte check
        run: npm run check

      - name: Tests unitarios
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Auditoría de dependencias
        run: npm audit --audit-level=high

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mitteiru-backend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun test

      - name: Auditoría de dependencias
        run: npm audit --omit=dev --audit-level=high
